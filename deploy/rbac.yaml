apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-controller
rules:
  # 监听Namespace事件
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  
  # 管理Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # 读取ConfigMaps（可选，用于配置）
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  
  # 读取Events（用于调试）
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-controller
subjects:
  - kind: ServiceAccount
    name: secrets-controller
    namespace: kube-system