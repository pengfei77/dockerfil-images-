apiVersion: v1
kind: Secret
metadata:
  name: controller-certificates
  namespace: kube-system
type: Opaque
data:
  # 这里需要提供base64编码的证书和密钥文件
  # 示例：使用base64编码后的内容
  # cert.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  # key.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...
---
# 使用说明：
# 1. 生成自签名证书（用于测试）：
#    openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#      -keyout key.key -out cert.crt \
#      -subj "/CN=secrets-controller/O=system"
#
# 2. 对证书文件进行base64编码：
#    cat cert.crt | base64 -w 0
#    cat key.key | base64 -w 0
#
# 3. 将编码后的内容替换到上面的data字段中