apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-controller
  namespace: kube-system
  labels:
    app: secrets-controller
    component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-controller
  template:
    metadata:
      labels:
        app: secrets-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: secrets-controller
      containers:
      - name: secrets-controller
        image: your-registry/secrets-controller:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CERT_FILE_PATH
          value: "/etc/secrets-controller/cert.crt"
        - name: KEY_FILE_PATH
          value: "/etc/secrets-controller/key.key"
        - name: SECRET_NAME
          value: "tls-secret"
        - name: THREADINESS
          value: "2"
        - name: RESYNC_PERIOD
          value: "30"
        - name: METRICS_PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        - name: EXCLUDE_PREFIXES
          value: "kube-"
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: cert-volume
          mountPath: /etc/secrets-controller
          readOnly: true
      volumes:
      - name: cert-volume
        secret:
          secretName: controller-certificates
          optional: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000