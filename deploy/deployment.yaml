apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-controller
  namespace: kube-system
  labels:
    app: secrets-controller
    component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-controller
  template:
    metadata:
      labels:
        app: secrets-controller
    spec:
      serviceAccountName: secrets-controller
      containers:
      - name: secrets-controller
        image: your-registry/secrets-controller:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CERT_FILE_PATH
          value: "/etc/secrets-controller/cert.crt"
        - name: KEY_FILE_PATH
          value: "/etc/secrets-controller/key.key"
        - name: SECRET_NAME
          value: "tls-secret"
        - name: THREADINESS
          value: "2"
        - name: RESYNC_PERIOD
          value: "30"
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        - name: EXCLUDE_PREFIXES
          value: "kube-"

        # 健康检查已移除，因为移除了监控功能
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        # 不再需要证书挂载卷，证书文件通过本地路径提供
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000